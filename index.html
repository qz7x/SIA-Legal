            --sia-blue: #00266B;

            --festive-glow: rgba(229, 160, 34, 0.3);
            --pop-curve: cubic-bezier(0.175, 0.885, 0.32, 1.275);

        /* ANTI-COPY PROTECTION */
        body {
            user-select: none;
            -webkit-user-select: none;
            background: radial-gradient(circle at center, #001A4D 0%, #000814 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* FESTIVE FLOATING ORBS */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--sia-blue); top: -10%; left: -10%; }
        .orb-2 { width: 300px; height: 300px; background: var(--sia-gold); bottom: -5%; right: -5%; opacity: 0.4; }

        @keyframes float { from { transform: translate(0,0); } to { transform: translate(50px, 100px); } }

        /* HEADER */

            padding: 25px 50px;
            display: flex;

            align-items: center;

            border-bottom: 2px solid var(--sia-gold);
            box-shadow: 0 0 40px rgba(229, 160, 34, 0.2);
            position: sticky; top: 0; z-index: 1000;
